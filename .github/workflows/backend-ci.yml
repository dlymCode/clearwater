name: backend-ci

on:
  push:
    paths:
      - "supabase/**"
      - "workers/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "workers/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  # Never cancel runs on main so every merged commit gets a full result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pgtap:
    name: pgTAP (supabase db)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Local Supabase needs Docker and a fully provisioned project.
    # TODO: remove continue-on-error once Docker-based run is proven in CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # TODO: pin to a verified CLI version once one is confirmed; latest is used until then.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Reset database from migrations and seed
        run: supabase db reset

      - name: Run pgTAP tests
        run: supabase test db

  deno-edge-functions:
    name: Deno tests (supabase/functions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        if: hashFiles('supabase/functions/**/*_test.ts') != ''
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run edge function tests
        if: hashFiles('supabase/functions/**/*_test.ts') != ''
        run: deno test -A supabase/functions

  workers-tile-auth:
    name: Node tests (workers/tile-auth)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/tile-auth
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
