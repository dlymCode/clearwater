name: pipeline-ci

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/pipeline-ci.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - ".github/workflows/pipeline-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-ci-${{ github.ref }}
  # Never cancel runs on main so every merged commit gets a full result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: pytest (pipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # TODO: make blocking once the pipeline is ruff-clean.
      # ruff is expected in requirements-dev.txt (pipeline owner).
      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check .

      - name: Run pytest
        run: pytest tests -q

      # Validates the tiles index shape against the JSON Schema.
      - name: Validate tiles index schema
        if: hashFiles('pipeline/tests/fixtures/tiles_index.example.json') != ''
        run: python -m jsonschema -i tests/fixtures/tiles_index.example.json schemas/tiles_index.schema.json
